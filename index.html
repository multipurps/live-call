<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Live Call</title>
<meta name="theme-color" content="#1e130d" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<style>
  :root{
    --accent:#0f9d68;
    --panel:#3a2a20;
    --line: rgba(255,222,196,0.14);
    --dim: rgba(255,230,210,0.55);
    --coffee:#1e130d;
    --coffee-light:#2b1c14;
    --tabbar-h:44px; /* fixed content height of the tab bar, excludes safe area. Single source of truth - never let this be content-driven. */
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent; margin:0; padding:0; -webkit-text-size-adjust:100%;}
  html,body{height:100%; background:var(--coffee); overflow:hidden;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    color:#fff;
    position:fixed; inset:0; width:100vw; height:100dvh;
  }
  button{-webkit-appearance:none; appearance:none; border:0; cursor:pointer; font-family:inherit; color:#fff; background:none;}

  #app{position:fixed; inset:0;}
  #screens{position:absolute; inset:0;}
  .screen{
    position:absolute; inset:0; overflow-y:auto;
    padding-top:max(env(safe-area-inset-top), 16px);
    padding-left:18px; padding-right:18px;
    padding-bottom:110px; /* keeps content clear of the floating dock, not the dock itself */
    display:none;
  }
  .screen.active{display:block;}

  /* ---------- bottom tab nav: flush to true screen edge, no safe-area padding (explicit user choice, accepts gesture-zone tap risk) ---------- */
  #tabBar{
    position:fixed; left:0; right:0; bottom:0; z-index:10;
    height:var(--tabbar-h);
    display:flex;
    background:#1e130d;
    border-top:1px solid rgba(255,255,255,0.14);
  }
  .tabBtn{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    color:var(--dim); font-size:10px; line-height:1.15; font-weight:600;
  }
  .tabBtn.active{color:#fff;}
  .tabBtn svg{width:18px; height:18px;}

  /* ---------- brief input: floats free above the tab nav, own pill, not attached to anything ---------- */
  #homeInputBar{
    display:none; align-items:center; gap:8px;
    position:fixed; left:14px; right:14px; bottom:calc(var(--tabbar-h) + 12px); z-index:9;
    padding:8px 8px 8px 16px;
    background:#2b1c14;
    border-radius:28px;
    box-shadow:0 8px 24px rgba(0,0,0,0.45);
  }
  #homeInputBar.visible{display:flex;}
  #briefInput{
    flex:1; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.12); border-radius:18px;
    color:#fff; font-size:15px; padding:9px 14px; font-family:inherit;
  }
  #briefInput::placeholder{color:var(--dim);}

  h1.pageTitle{font-size:22px; font-weight:700; letter-spacing:-0.01em; margin:6px 0 18px;}

  .field{margin-bottom:18px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--dim); margin-bottom:8px; text-transform:uppercase; letter-spacing:0.04em;}
  .field textarea, .field select{
    width:100%; background:var(--panel); border:1px solid var(--line); border-radius:12px;
    color:#fff; font-size:14.5px; padding:12px; font-family:inherit; -webkit-appearance:none; appearance:none;
  }
  .field textarea{min-height:130px; resize:vertical; line-height:1.45;}

  .providerToggle{display:flex; background:var(--panel); border-radius:12px; padding:4px; border:1px solid var(--line);}
  .providerToggle button{flex:1; padding:11px; border-radius:9px; font-size:13.5px; font-weight:600; color:var(--dim);}
  .providerToggle button.active{background:var(--accent); color:#fff;}

  .startBtn{
    background:var(--accent); color:#fff; font-weight:650; font-size:16px;
    width:36px; height:36px; border-radius:50%; flex:none;
    display:flex; align-items:center; justify-content:center;
  }

  .hint{font-size:12px; color:var(--dim); text-align:center; margin-top:10px; line-height:1.4;}

  .callRow{
    padding:14px 0; border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
  }
  .callRow .name{font-size:15px; font-weight:650;}
  .callRow .summary{font-size:12.5px; color:var(--dim); margin-top:3px;}
  .callRow .time{font-size:11.5px; color:var(--dim); white-space:nowrap;}
  .emptyState{padding:60px 0; text-align:center; color:var(--dim); font-size:13.5px; line-height:1.5;}

  .avatarCircle{
    width:88px; height:88px; border-radius:50%; margin:8px auto 14px;
    background:linear-gradient(135deg, #0f9d68, #3a2a20);
    display:flex; align-items:center; justify-content:center; font-size:32px; font-weight:700;
  }
  .profileName{text-align:center; font-size:18px; font-weight:650; margin-bottom:22px;}
  .settingsRow{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:14px; margin-bottom:10px;
  }
  .settingsRow .label{font-size:11.5px; font-weight:600; color:var(--dim); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:6px;}

  #callScreen{
    position:fixed; inset:0; width:100vw; height:100dvh; background:var(--coffee);
    display:none; z-index:50;
  }
  #callScreen.active{display:block;}
  #remoteVideo{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; border:0; background:var(--coffee);
  }
  #callIdle{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; text-align:center; padding:0 32px;
  }
  #callStatus{font-size:13px; color:var(--dim);}

  #callTop{
    position:absolute; left:0; right:0; top:0;
    padding-top:max(env(safe-area-inset-top), 10px);
    padding-left:14px; padding-right:14px;
    display:flex; justify-content:flex-start;
  }
  .pill{
    background:rgba(43,28,20,0.82); backdrop-filter:blur(20px);
    border:1px solid var(--line); border-radius:100px;
    padding:9px 14px; font-size:12.5px; font-weight:600; color:#fff;
    display:flex; align-items:center; gap:7px;
  }
  .dot{width:7px; height:7px; border-radius:50%; background:#3a3a3d;}
  .dot.live{background:#3ddc6a;}

  #callBottom{
    position:absolute; left:0; right:0; bottom:0;
    padding-bottom:max(env(safe-area-inset-bottom), 18px);
    display:flex; justify-content:center; align-items:center; gap:14px;
    transition:opacity 0.2s;
  }
  #callBottom.hidden{opacity:0; pointer-events:none;}
  .roundBtn{
    width:52px; height:52px; border-radius:50%;
    background:rgba(43,28,20,0.82); backdrop-filter:blur(20px); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
  }
  .roundBtn.muted{background:var(--accent); border-color:var(--accent);}
  .endBtn{
    width:64px; height:64px; border-radius:50%;
    background:#ff3b30; display:flex; align-items:center; justify-content:center;
  }
  #authScreen{
    position:fixed; inset:0; z-index:100; background:var(--coffee);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  #authScreen.hidden{display:none;}
  #authBox{width:100%; max-width:340px;}
  #authBox .field{margin-bottom:14px;}
  #authToggleMode{
    width:100%; text-align:center; padding:12px; font-size:13px; color:var(--dim); margin-top:6px;
  }
</style>
</head>
<body>

<div id="authScreen">
  <div id="authBox">
    <h1 class="pageTitle" style="text-align:center;">Live Call</h1>
    <div class="field">
      <label>Email</label>
      <input id="authEmail" type="email" autocomplete="email" />
    </div>
    <div class="field">
      <label>Password</label>
      <input id="authPassword" type="password" autocomplete="current-password" />
    </div>
    <button class="startBtn" id="authSubmit" style="width:100%; height:auto; border-radius:14px; padding:14px;">Sign in</button>
    <button id="authToggleMode">Need an account? Sign up</button>
    <p class="hint" id="authHint"></p>
  </div>
</div>

<div id="app">
  <div id="screens">

    <div class="screen active" id="screenHome">
      <h1 class="pageTitle">Brief the call</h1>

      <div class="field">
        <label>Provider</label>
        <div class="providerToggle">
          <button id="pickHeygen" class="active">HeyGen</button>
          <button id="pickTavus">Tavus</button>
        </div>
      </div>

      <div class="field" id="heygenFields">
        <label>HeyGen avatar</label>
        <select id="heygenAvatarId"><option value="">Loading your avatars…</option></select>
      </div>
      <div class="field" id="tavusFields" style="display:none;">
        <label>Tavus replica</label>
        <select id="tavusReplicaId"><option value="">Loading your replicas…</option></select>
      </div>

      <p class="hint" id="homeHint" style="margin-bottom:8px;"></p>
    </div>

    <div class="screen" id="screenRecent">
      <h1 class="pageTitle">Recent</h1>
      <div id="recentList"></div>
    </div>

    <div class="screen" id="screenProfile">
      <h1 class="pageTitle">Profile</h1>
      <div class="avatarCircle" id="profileInitial">L</div>
      <div class="profileName" id="profileEmail">Live Call</div>

      <div class="settingsRow">
        <div class="label">Active provider</div>
        <div id="profileProvider">HeyGen</div>
      </div>
      <div class="settingsRow">
        <div class="label">HeyGen avatar</div>
        <div id="profileHeygenAvatar">Not set</div>
      </div>
      <div class="settingsRow">
        <div class="label">Tavus replica</div>
        <div id="profileTavusReplica">Account default</div>
      </div>

      <button class="startBtn" id="signOutBtn" style="width:100%; height:auto; border-radius:14px; padding:14px; background:#3a2a20; margin-top:16px;">Sign out</button>
    </div>

  </div>

  <div id="homeInputBar" class="visible">
    <input id="briefInput" type="text" placeholder="Tell it what to do…" />
    <button id="startBtn" aria-label="Start call">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M12 9c-2.5 0-4.9.5-7 1.4a1.5 1.5 0 0 0-.9 1.7l.6 2.5c.15.6.7 1 1.3 1 .2 0 .4 0 .6-.1l2-.8c.4-.15.7-.5.8-.9l.3-1.3c1.3-.3 2.7-.5 4.3-.5s3 .2 4.3.5l.3 1.3c.1.4.4.75.8.9l2 .8c.2.1.4.1.6.1.6 0 1.15-.4 1.3-1l.6-2.5a1.5 1.5 0 0 0-.9-1.7C16.9 9.5 14.5 9 12 9z"/></svg>
    </button>
  </div>

  <div id="tabBar">
    <button class="tabBtn active" data-tab="home">
      <svg viewBox="0 0 24 24" fill="none"><path fill-rule="evenodd" clip-rule="evenodd" d="M2.33537 7.87495C1.79491 9.00229 1.98463 10.3208 2.36407 12.9579L2.64284 14.8952C3.13025 18.2827 3.37396 19.9764 4.54903 20.9882C5.72409 22 7.44737 22 10.8939 22H13.1061C16.5526 22 18.2759 22 19.451 20.9882C20.626 19.9764 20.8697 18.2827 21.3572 14.8952L21.6359 12.9579C22.0154 10.3208 22.2051 9.00229 21.6646 7.87495C21.1242 6.7476 19.9738 6.06234 17.6731 4.69181L16.2882 3.86687C14.199 2.62229 13.1543 2 12 2C10.8457 2 9.80104 2.62229 7.71175 3.86687L6.32691 4.69181C4.02619 6.06234 2.87583 6.7476 2.33537 7.87495ZM8.2501 17.9998C8.2501 17.5856 8.58589 17.2498 9.0001 17.2498H15.0001C15.4143 17.2498 15.7501 17.5856 15.7501 17.9998C15.7501 18.414 15.4143 18.7498 15.0001 18.7498H9.0001C8.58589 18.7498 8.2501 18.414 8.2501 17.9998Z" fill="currentColor"/></svg>
      Home
    </button>
    <button class="tabBtn" data-tab="recent">
      <svg viewBox="0 0 24 24" fill="none"><path fill-rule="evenodd" clip-rule="evenodd" d="M22 12c0 5.523-4.477 10-10 10S2 17.523 2 12 6.477 2 12 2s10 4.477 10 10zm-4.581 3.324a1 1 0 0 0-.525-1.313L13 12.341V6.5a1 1 0 0 0-2 0v6.17c0 .6.357 1.143.909 1.379l4.197 1.8a1 1 0 0 0 1.313-.525z" fill="currentColor"/></svg>
      Recent
    </button>
    <button class="tabBtn" data-tab="profile">
      <svg viewBox="0 0 24 24" fill="none"><path fill-rule="evenodd" clip-rule="evenodd" d="M6.75 6.5C6.75 3.6005 9.1005 1.25 12 1.25C14.8995 1.25 17.25 3.6005 17.25 6.5C17.25 9.3995 14.8995 11.75 12 11.75C9.1005 11.75 6.75 9.3995 6.75 6.5Z" fill="currentColor"/><path fill-rule="evenodd" clip-rule="evenodd" d="M4.25 18.5714C4.25 15.6325 6.63249 13.25 9.57143 13.25H14.4286C17.3675 13.25 19.75 15.6325 19.75 18.5714C19.75 20.8792 17.8792 22.75 15.5714 22.75H8.42857C6.12081 22.75 4.25 20.8792 4.25 18.5714Z" fill="currentColor"/></svg>
      Profile
    </button>
  </div>
</div>

<div id="callScreen">
  <video id="remoteVideo" autoplay playsinline style="display:none;"></video>

  <div id="callIdle">
    <div id="callStatus">Connecting…</div>
  </div>

  <div id="callBottom" class="hidden">
    <button class="roundBtn" id="muteBtn" aria-label="Mute">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4"/></svg>
    </button>
    <button class="endBtn" id="endBtn" aria-label="End call">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M12 9c-2.5 0-4.9.5-7 1.4a1.5 1.5 0 0 0-.9 1.7l.6 2.5c.15.6.7 1 1.3 1 .2 0 .4 0 .6-.1l2-.8c.4-.15.7-.5.8-.9l.3-1.3c1.3-.3 2.7-.5 4.3-.5s3 .2 4.3.5l.3 1.3c.1.4.4.75.8.9l2 .8c.2.1.4.1.6.1.6 0 1.15-.4 1.3-1l.6-2.5a1.5 1.5 0 0 0-.9-1.7C16.9 9.5 14.5 9 12 9z"/></svg>
    </button>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  const SUPABASE_URL = 'https://ewgtpxomgkpbmfyddypw.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_NkeueZ7vabkD9nUIPDaGwQ_GCd5Ci40';
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  // Note: this is Supabase's publishable/anon key, which is designed to be safely embedded in
  // client-side code — access is controlled by the Row Level Security policies on each table
  // (see supabase_schema.sql), not by hiding this key. The session token itself is the only
  // thing Supabase's own SDK keeps in localStorage — everything else below reads/writes Supabase.

  const $ = (id) => document.getElementById(id);

  const screens = { home: $('screenHome'), recent: $('screenRecent'), profile: $('screenProfile') };
  const tabBtns = document.querySelectorAll('.tabBtn');
  function showTab(name){
    Object.entries(screens).forEach(([k, el]) => el.classList.toggle('active', k === name));
    tabBtns.forEach(b => b.classList.toggle('active', b.dataset.tab === name));
    $('homeInputBar').classList.toggle('visible', name === 'home');
    if (name === 'recent') renderRecent();
    if (name === 'profile') renderProfile();
  }
  tabBtns.forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));

  const state = {
    provider: 'heygen',
    systemPrompt: '',
    heygenAvatarId: '',
    heygenAvatarName: '',
    tavusReplicaId: '',
    tavusReplicaName: '',
  };
  let currentUser = null;

  async function persist(){
    if (!currentUser) return;
    await supabase.from('video_call_settings').upsert({
      user_id: currentUser.id,
      provider: state.provider,
      system_prompt: state.systemPrompt,
      heygen_avatar_id: state.heygenAvatarId,
      heygen_avatar_name: state.heygenAvatarName,
      tavus_replica_id: state.tavusReplicaId,
      tavus_replica_name: state.tavusReplicaName,
      updated_at: new Date().toISOString(),
    });
  }

  async function loadSettings(){
    const { data } = await supabase.from('video_call_settings').select('*').eq('user_id', currentUser.id).maybeSingle();
    if (data) {
      state.provider = data.provider || 'heygen';
      state.systemPrompt = data.system_prompt || '';
      state.heygenAvatarId = data.heygen_avatar_id || '';
      state.heygenAvatarName = data.heygen_avatar_name || '';
      state.tavusReplicaId = data.tavus_replica_id || '';
      state.tavusReplicaName = data.tavus_replica_name || '';
    } else {
      await persist(); // first login — create the row
    }
    $('briefInput').value = state.systemPrompt;
    setProviderUI(state.provider);
  }

  function setProviderUI(p){
    state.provider = p; persist();
    $('pickHeygen').classList.toggle('active', p === 'heygen');
    $('pickTavus').classList.toggle('active', p === 'tavus');
    $('heygenFields').style.display = p === 'heygen' ? 'block' : 'none';
    $('tavusFields').style.display = p === 'tavus' ? 'block' : 'none';
  }
  $('pickHeygen').addEventListener('click', () => setProviderUI('heygen'));
  $('pickTavus').addEventListener('click', () => setProviderUI('tavus'));
  $('briefInput').addEventListener('change', () => { state.systemPrompt = $('briefInput').value; persist(); });

  async function loadHeygenAvatars(){
    const sel = $('heygenAvatarId');
    try {
      const r = await fetch('/api/heygen-avatars');
      const data = await r.json();
      if (!r.ok) { sel.innerHTML = '<option value="">Could not load — check HEYGEN_API_KEY</option>'; return; }
      const avatars = data.avatars || [];
      if (!avatars.length) { sel.innerHTML = '<option value="">No avatars yet — create one at labs.heygen.com</option>'; return; }
      sel.innerHTML = avatars.map(a => `<option value="${a.id}">${a.name}</option>`).join('');
      if (state.heygenAvatarId) sel.value = state.heygenAvatarId;
      sel.addEventListener('change', () => {
        state.heygenAvatarId = sel.value;
        state.heygenAvatarName = sel.options[sel.selectedIndex]?.textContent || '';
        persist();
      });
    } catch (e) { sel.innerHTML = '<option value="">Could not load avatars</option>'; }
  }
  async function loadTavusReplicas(){
    const sel = $('tavusReplicaId');
    try {
      const r = await fetch('/api/tavus-replicas');
      const data = await r.json();
      if (!r.ok) { sel.innerHTML = '<option value="">Could not load — check TAVUS_API_KEY</option>'; return; }
      const replicas = data.replicas || [];
      sel.innerHTML = '<option value="">Use account default</option>' + replicas.map(r => `<option value="${r.id}">${r.name}${r.status ? ' — ' + r.status : ''}</option>`).join('');
      if (state.tavusReplicaId) sel.value = state.tavusReplicaId;
      sel.addEventListener('change', () => {
        state.tavusReplicaId = sel.value;
        state.tavusReplicaName = sel.options[sel.selectedIndex]?.textContent || '';
        persist();
      });
    } catch (e) { sel.innerHTML = '<option value="">Could not load replicas</option>'; }
  }

  function renderProfile(){
    $('profileEmail').textContent = currentUser?.email || 'Live Call';
    $('profileProvider').textContent = state.provider === 'heygen' ? 'HeyGen' : 'Tavus';
    $('profileHeygenAvatar').textContent = state.heygenAvatarName || 'Not set';
    $('profileTavusReplica').textContent = state.tavusReplicaName || 'Account default';
  }

  async function addHistory(entry){
    if (!currentUser) return;
    await supabase.from('video_call_history').insert({
      user_id: currentUser.id,
      provider: entry.provider,
      summary: entry.summary,
    });
  }
  async function renderRecent(){
    const list = $('recentList');
    if (!currentUser) return;
    const { data, error } = await supabase
      .from('video_call_history')
      .select('*')
      .eq('user_id', currentUser.id)
      .order('created_at', { ascending: false })
      .limit(50);
    if (error || !data || !data.length) { list.innerHTML = '<div class="emptyState">No calls yet. Brief the AI on Home and start one.</div>'; return; }
    list.innerHTML = data.map(e => `
      <div class="callRow">
        <div>
          <div class="name">${e.provider === 'heygen' ? 'HeyGen' : 'Tavus'} call</div>
          <div class="summary">${e.summary}</div>
        </div>
        <div class="time">${new Date(e.created_at).toLocaleString([], { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' })}</div>
      </div>
    `).join('');
  }

  const callScreen = $('callScreen'), callIdle = $('callIdle'), callStatus = $('callStatus'), callBottom = $('callBottom');
  const remoteVideo = $('remoteVideo'), liveDot = $('liveDot');
  let heygenAvatar = null, dailyCall = null, micStream = null, audioCtx = null, callStartedAt = null;

  function primeAudioSession(){
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      gain.gain.value = 0;
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      setTimeout(() => { try { osc.stop(); } catch(e){} }, 300);
    } catch (e) {}
  }

  async function startCall(){
    state.systemPrompt = $('briefInput').value.trim();
    persist();
    if (!state.systemPrompt) {
      $('homeHint').textContent = 'Type what you want it to do first.';
      return;
    }
    if (state.provider === 'heygen' && !state.heygenAvatarId) {
      $('homeHint').textContent = 'Pick a HeyGen avatar first.';
      return;
    }
    $('homeHint').textContent = '';

    callScreen.classList.add('active');
    callIdle.style.display = 'flex';
    callStatus.textContent = 'Connecting…';
    liveDot.classList.remove('live');

    primeAudioSession();

    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      callStatus.textContent = 'Microphone permission is required';
      return;
    }

    callStartedAt = Date.now();
    if (state.provider === 'heygen') await startHeygen(); else await startTavus();
  }

  async function startHeygen(){
    const tokenResp = await fetch('/api/heygen-token', { method: 'POST' });
    const tokenData = await tokenResp.json();
    if (!tokenResp.ok) { callStatus.textContent = 'HeyGen error: ' + JSON.stringify(tokenData.error); return; }

    const { default: StreamingAvatar, AvatarQuality, StreamingEvents } =
      await import('https://esm.sh/@heygen/streaming-avatar@latest');

    heygenAvatar = new StreamingAvatar({ token: tokenData.token });

    heygenAvatar.on(StreamingEvents.STREAM_READY, (event) => {
      remoteVideo.srcObject = event.detail;
      remoteVideo.volume = 1.0;
      remoteVideo.style.display = 'block';
      callIdle.style.display = 'none';
      liveDot.classList.add('live');
    });
    heygenAvatar.on(StreamingEvents.STREAM_DISCONNECTED, () => endCall());

    await heygenAvatar.createStartAvatar({
      quality: AvatarQuality.High,
      avatarName: state.heygenAvatarId,
      knowledgeBase: state.systemPrompt,
    });
    await heygenAvatar.startVoiceChat();
  }

  async function startTavus(){
    const resp = await fetch('/api/tavus-conversation', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ systemPrompt: state.systemPrompt, replicaId: state.tavusReplicaId || undefined }),
    });
    const data = await resp.json();
    if (!resp.ok) { callStatus.textContent = 'Tavus error: ' + JSON.stringify(data.error); return; }

    const { default: Daily } = await import('https://esm.sh/@daily-co/daily-js@latest');
    dailyCall = Daily.createCallObject();

    // Create the output stream ONCE, up front, and only ever addTrack to this same object.
    // Reassigning video.srcObject each time a track arrives is what was breaking audio —
    // Safari doesn't reliably pick up a re-assigned MediaStream mid-call, only tracks
    // added to an already-attached stream.
    const outStream = new MediaStream();
    remoteVideo.srcObject = outStream;
    remoteVideo.muted = false;
    remoteVideo.volume = 1.0;

    dailyCall.on('track-started', (ev) => {
      if (ev.participant?.local) return; // don't render our own mic/camera back to ourselves
      outStream.addTrack(ev.track);
      remoteVideo.play().catch(() => {});
      if (ev.track.kind === 'video') {
        remoteVideo.style.display = 'block';
        callIdle.style.display = 'none';
        liveDot.classList.add('live');
      }
    });
    dailyCall.on('left-meeting', () => endCall());

    await dailyCall.join({ url: data.conversation_url, videoSource: false, audioSource: micStream ? micStream.getAudioTracks()[0] : true });
  }

  function endCall(){
    const durationSec = callStartedAt ? Math.round((Date.now() - callStartedAt) / 1000) : 0;
    if (callStartedAt) {
      addHistory({
        provider: state.provider,
        time: new Date().toLocaleString([], { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' }),
        summary: durationSec > 0 ? `Call ended after ${durationSec}s` : 'Call ended immediately',
      });
    }
    if (heygenAvatar) { try { heygenAvatar.stopAvatar(); } catch(e){} heygenAvatar = null; }
    if (dailyCall) { try { dailyCall.leave(); dailyCall.destroy(); } catch(e){} dailyCall = null; }
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    if (audioCtx) { try { audioCtx.close(); } catch(e){} audioCtx = null; }
    remoteVideo.srcObject = null;
    remoteVideo.style.display = 'none';
    liveDot.classList.remove('live');
    callBottom.classList.add('hidden');
    callScreen.classList.remove('active');
    callStartedAt = null;
  }

  callScreen.addEventListener('click', (e) => {
    if (e.target.closest('#callTop') || e.target.closest('#callBottom')) return;
    callBottom.classList.toggle('hidden');
  });

  let muted = false;
  $('muteBtn').addEventListener('click', () => {
    muted = !muted;
    if (micStream) micStream.getAudioTracks().forEach(t => t.enabled = !muted);
    $('muteBtn').classList.toggle('muted', muted);
    $('muteBtn').innerHTML = muted
      ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8"><path d="M3 3l18 18"/><path d="M12 1a3 3 0 0 0-3 3v6.5M15 9V4a3 3 0 0 0-3-3"/><path d="M19 10v2a7 7 0 0 1-9.8 6.4M5 10v2a7 7 0 0 0 2 4.9"/><path d="M12 19v4"/></svg>'
      : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4"/></svg>';
  });

  $('startBtn').addEventListener('click', startCall);
  $('endBtn').addEventListener('click', endCall);

  // ---------- auth ----------
  const authScreen = $('authScreen');
  let authMode = 'signin';

  $('authToggleMode').addEventListener('click', () => {
    authMode = authMode === 'signin' ? 'signup' : 'signin';
    $('authSubmit').textContent = authMode === 'signin' ? 'Sign in' : 'Sign up';
    $('authToggleMode').textContent = authMode === 'signin' ? 'Need an account? Sign up' : 'Have an account? Sign in';
    $('authHint').textContent = '';
  });

  $('authSubmit').addEventListener('click', async () => {
    const email = $('authEmail').value.trim();
    const password = $('authPassword').value;
    if (!email || !password) { $('authHint').textContent = 'Enter an email and password.'; return; }
    $('authHint').textContent = 'Working…';
    const { error } = authMode === 'signin'
      ? await supabase.auth.signInWithPassword({ email, password })
      : await supabase.auth.signUp({ email, password });
    if (error) { $('authHint').textContent = error.message; return; }
    if (authMode === 'signup') { $('authHint').textContent = 'Check your email to confirm, then sign in.'; }
  });

  $('signOutBtn').addEventListener('click', async () => {
    await supabase.auth.signOut();
  });

  async function enterApp(user){
    currentUser = user;
    authScreen.classList.add('hidden');
    await loadSettings();
    loadHeygenAvatars();
    loadTavusReplicas();
  }

  supabase.auth.onAuthStateChange((_event, session) => {
    if (session?.user) {
      enterApp(session.user);
    } else {
      currentUser = null;
      authScreen.classList.remove('hidden');
    }
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
