<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Live Call</title>
<meta name="theme-color" content="#000000" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<style>
  :root{
    --accent:#ff5a36;
    --panel: rgba(20,20,22,0.86);
    --line: rgba(255,255,255,0.14);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent; margin:0; padding:0;}
  html,body{height:100%; background:#000; overflow:hidden;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    color:#fff;
    position:fixed; inset:0; width:100vw; height:100dvh;
  }

  /* full-bleed video layer — no padding, goes edge to edge including under the notch */
  #stage{ position:fixed; inset:0; width:100vw; height:100dvh; background:#000; }
  #remoteVideo, #tavusFrame{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; border:0; background:#000;
  }

  #idle{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; text-align:center; padding:0 32px;
  }
  #idle h1{font-size:19px; font-weight:650; letter-spacing:-0.01em;}
  #idle p{font-size:13.5px; color:rgba(255,255,255,0.5); line-height:1.5; max-width:280px;}

  /* floating controls — only the tap targets themselves respect safe area, the video never does */
  #topBar{
    position:absolute; left:0; right:0; top:0;
    padding-top:max(env(safe-area-inset-top), 10px);
    display:flex; justify-content:space-between; align-items:flex-start;
    padding-left:14px; padding-right:14px;
    pointer-events:none;
  }
  #topBar > *{pointer-events:auto;}
  .pill{
    background:var(--panel); backdrop-filter:blur(20px);
    border:1px solid var(--line); border-radius:100px;
    padding:9px 14px; font-size:12.5px; font-weight:600; color:#fff;
    display:flex; align-items:center; gap:7px;
  }
  .dot{width:7px; height:7px; border-radius:50%; background:#3a3a3d;}
  .dot.live{background:#3ddc6a;}

  #bottomBar{
    position:absolute; left:0; right:0; bottom:0;
    padding-bottom:max(env(safe-area-inset-bottom), 18px);
    display:flex; justify-content:center; align-items:center; gap:14px;
    transition:opacity 0.2s;
  }
  #bottomBar.hidden{opacity:0; pointer-events:none;}

  button{
    -webkit-appearance:none; appearance:none; border:0; cursor:pointer;
    font-family:inherit; color:#fff;
  }
  .roundBtn{
    width:52px; height:52px; border-radius:50%;
    background:var(--panel); backdrop-filter:blur(20px); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
  }
  .endBtn{
    width:64px; height:64px; border-radius:50%;
    background:#ff3b30; display:flex; align-items:center; justify-content:center;
  }
  .startBtn{
    background:var(--accent); color:#fff; font-weight:650; font-size:15px;
    padding:15px 26px; border-radius:14px; width:100%;
  }

  #settingsSheet{
    position:absolute; inset:0; background:rgba(0,0,0,0.92); backdrop-filter:blur(10px);
    display:flex; flex-direction:column; z-index:20;
    transform:translateY(100%); transition:transform 0.25s ease;
  }
  #settingsSheet.open{transform:translateY(0);}
  #settingsSheet .header{
    padding-top:max(env(safe-area-inset-top), 16px);
    padding:16px; display:flex; justify-content:space-between; align-items:center;
    border-bottom:1px solid var(--line);
  }
  #settingsSheet .header h2{font-size:16px; font-weight:650;}
  #settingsSheet .body{flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:16px;}
  #settingsSheet .footer{padding:16px; padding-bottom:max(env(safe-area-inset-bottom), 16px);}

  .field label{display:block; font-size:12px; font-weight:600; color:rgba(255,255,255,0.55); margin-bottom:7px; text-transform:uppercase; letter-spacing:0.03em;}
  .field textarea, .field input{
    width:100%; background:rgba(255,255,255,0.06); border:1px solid var(--line); border-radius:12px;
    color:#fff; font-size:14.5px; padding:12px; font-family:inherit;
  }
  .field textarea{min-height:110px; resize:vertical; line-height:1.4;}

  .providerToggle{display:flex; background:rgba(255,255,255,0.06); border-radius:12px; padding:4px; border:1px solid var(--line);}
  .providerToggle button{flex:1; padding:10px; border-radius:9px; font-size:13.5px; font-weight:600; color:rgba(255,255,255,0.5);}
  .providerToggle button.active{background:var(--accent); color:#fff;}

  #closeSettings{width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,0.08); display:flex; align-items:center; justify-content:center;}

  #statusLine{position:absolute; top:60%; left:0; right:0; text-align:center; font-size:12.5px; color:rgba(255,255,255,0.45); padding:0 30px;}
</style>
</head>
<body>

<div id="stage">
  <video id="remoteVideo" autoplay playsinline style="display:none;"></video>
  <iframe id="tavusFrame" allow="camera; microphone; autoplay; display-capture" style="display:none;"></iframe>

  <div id="idle">
    <h1>Live Call</h1>
    <p>Set the persona and pick a provider, then start the call.</p>
    <div style="width:100%; max-width:280px;">
      <button class="startBtn" id="startBtn">Start call</button>
    </div>
  </div>

  <div id="statusLine"></div>

  <div id="topBar">
    <div class="pill"><span class="dot" id="liveDot"></span><span id="providerLabel">HeyGen</span></div>
    <button class="roundBtn" id="settingsBtn" aria-label="Settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>

  <div id="bottomBar" class="hidden">
    <button class="roundBtn" id="muteBtn" aria-label="Mute">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4"/></svg>
    </button>
    <button class="endBtn" id="endBtn" aria-label="End call">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M12 9c-2.5 0-4.9.5-7 1.4a1.5 1.5 0 0 0-.9 1.7l.6 2.5c.15.6.7 1 1.3 1 .2 0 .4 0 .6-.1l2-.8c.4-.15.7-.5.8-.9l.3-1.3c1.3-.3 2.7-.5 4.3-.5s3 .2 4.3.5l.3 1.3c.1.4.4.75.8.9l2 .8c.2.1.4.1.6.1.6 0 1.15-.4 1.3-1l.6-2.5a1.5 1.5 0 0 0-.9-1.7C16.9 9.5 14.5 9 12 9z"/></svg>
    </button>
  </div>
</div>

<div id="settingsSheet">
  <div class="header">
    <h2>Call settings</h2>
    <button id="closeSettings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="body">
    <div class="field">
      <label>Provider</label>
      <div class="providerToggle">
        <button id="pickHeygen" class="active">HeyGen</button>
        <button id="pickTavus">Tavus</button>
      </div>
    </div>

    <div class="field">
      <label>Persona &amp; goal</label>
      <textarea id="systemPrompt" placeholder="You are... Keep the tone casual. Somewhere naturally in the conversation, not as an opener, explain that... Let the other person lead; respond to what they actually say.">You are a friend catching up on a casual call. Keep the tone warm and relaxed. Somewhere naturally in the conversation — not as an opener, only when it fits — explain the real reason you didn't show up to work. Let the other person lead; respond to what they actually say, ask follow-up questions, don't recite anything.</textarea>
    </div>

    <div class="field" id="heygenFields">
      <label>HeyGen avatar ID</label>
      <input id="heygenAvatarId" placeholder="from labs.heygen.com" />
    </div>
    <div class="field" id="heygenVoiceField">
      <label>HeyGen voice ID (optional)</label>
      <input id="heygenVoiceId" placeholder="leave blank for avatar default" />
    </div>

    <div class="field" id="tavusFields" style="display:none;">
      <label>Tavus replica ID (leave blank if your account has a default)</label>
      <input id="tavusReplicaId" placeholder="from your Tavus dashboard" />
    </div>
  </div>
  <div class="footer">
    <button class="startBtn" id="saveSettings">Save</button>
  </div>
</div>

<script type="module">
  const $ = (id) => document.getElementById(id);
  const idle = $('idle'), stage = $('stage'), topBar = $('topBar'), bottomBar = $('bottomBar');
  const settingsSheet = $('settingsSheet'), statusLine = $('statusLine');
  const remoteVideo = $('remoteVideo'), tavusFrame = $('tavusFrame');
  const liveDot = $('liveDot'), providerLabel = $('providerLabel');

  const state = {
    provider: localStorage.getItem('provider') || 'heygen',
    systemPrompt: localStorage.getItem('systemPrompt') || $('systemPrompt').value,
    heygenAvatarId: localStorage.getItem('heygenAvatarId') || '',
    heygenVoiceId: localStorage.getItem('heygenVoiceId') || '',
    tavusReplicaId: localStorage.getItem('tavusReplicaId') || '',
  };

  function applyStateToForm(){
    $('systemPrompt').value = state.systemPrompt;
    $('heygenAvatarId').value = state.heygenAvatarId;
    $('heygenVoiceId').value = state.heygenVoiceId;
    $('tavusReplicaId').value = state.tavusReplicaId;
    setProviderUI(state.provider);
  }
  function setProviderUI(p){
    state.provider = p;
    $('pickHeygen').classList.toggle('active', p === 'heygen');
    $('pickTavus').classList.toggle('active', p === 'tavus');
    $('heygenFields').style.display = p === 'heygen' ? 'block' : 'none';
    $('heygenVoiceField').style.display = p === 'heygen' ? 'block' : 'none';
    $('tavusFields').style.display = p === 'tavus' ? 'block' : 'none';
    providerLabel.textContent = p === 'heygen' ? 'HeyGen' : 'Tavus';
  }
  applyStateToForm();

  $('pickHeygen').addEventListener('click', () => setProviderUI('heygen'));
  $('pickTavus').addEventListener('click', () => setProviderUI('tavus'));
  $('settingsBtn').addEventListener('click', () => settingsSheet.classList.add('open'));
  $('closeSettings').addEventListener('click', () => settingsSheet.classList.remove('open'));
  $('saveSettings').addEventListener('click', () => {
    state.systemPrompt = $('systemPrompt').value;
    state.heygenAvatarId = $('heygenAvatarId').value;
    state.heygenVoiceId = $('heygenVoiceId').value;
    state.tavusReplicaId = $('tavusReplicaId').value;
    Object.entries(state).forEach(([k, v]) => localStorage.setItem(k, v));
    settingsSheet.classList.remove('open');
  });

  // tap video to toggle bottom controls
  stage.addEventListener('click', (e) => {
    if (e.target.closest('#topBar') || e.target.closest('#bottomBar')) return;
    bottomBar.classList.toggle('hidden');
  });

  let heygenAvatar = null;
  let micStream = null;

  async function startCall(){
    if (state.provider === 'heygen' && !state.heygenAvatarId) {
      settingsSheet.classList.add('open');
      return;
    }
    if (state.provider === 'tavus' && !state.systemPrompt) {
      settingsSheet.classList.add('open');
      return;
    }

    idle.style.display = 'none';
    statusLine.textContent = 'Connecting…';
    liveDot.classList.remove('live');

    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      statusLine.textContent = 'Microphone permission is required';
      idle.style.display = 'flex';
      return;
    }

    if (state.provider === 'heygen') {
      await startHeygen();
    } else {
      await startTavus();
    }
  }

  async function startHeygen(){
    const tokenResp = await fetch('/api/heygen-token', { method: 'POST' });
    const tokenData = await tokenResp.json();
    if (!tokenResp.ok) { statusLine.textContent = 'HeyGen error: ' + JSON.stringify(tokenData.error); idle.style.display = 'flex'; return; }

    const { default: StreamingAvatar, AvatarQuality, StreamingEvents } =
      await import('https://esm.sh/@heygen/streaming-avatar@latest');

    heygenAvatar = new StreamingAvatar({ token: tokenData.token });

    heygenAvatar.on(StreamingEvents.STREAM_READY, (event) => {
      remoteVideo.srcObject = event.detail;
      remoteVideo.style.display = 'block';
      statusLine.textContent = '';
      liveDot.classList.add('live');
    });
    heygenAvatar.on(StreamingEvents.STREAM_DISCONNECTED, endCall);

    const opts = {
      quality: AvatarQuality.High,
      avatarName: state.heygenAvatarId,
      knowledgeBase: state.systemPrompt,
    };
    if (state.heygenVoiceId) opts.voice = { voiceId: state.heygenVoiceId };

    await heygenAvatar.createStartAvatar(opts);
    await heygenAvatar.startVoiceChat();
  }

  async function startTavus(){
    const resp = await fetch('/api/tavus-conversation', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ systemPrompt: state.systemPrompt, replicaId: state.tavusReplicaId || undefined }),
    });
    const data = await resp.json();
    if (!resp.ok) { statusLine.textContent = 'Tavus error: ' + JSON.stringify(data.error); idle.style.display = 'flex'; return; }

    tavusFrame.src = data.conversation_url;
    tavusFrame.style.display = 'block';
    statusLine.textContent = '';
    liveDot.classList.add('live');
  }

  function endCall(){
    if (heygenAvatar) { try { heygenAvatar.stopAvatar(); } catch(e){} heygenAvatar = null; }
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    remoteVideo.srcObject = null;
    remoteVideo.style.display = 'none';
    tavusFrame.src = 'about:blank';
    tavusFrame.style.display = 'none';
    liveDot.classList.remove('live');
    statusLine.textContent = '';
    idle.style.display = 'flex';
    bottomBar.classList.add('hidden');
  }

  let muted = false;
  $('muteBtn').addEventListener('click', () => {
    muted = !muted;
    if (micStream) micStream.getAudioTracks().forEach(t => t.enabled = !muted);
  });

  $('startBtn').addEventListener('click', startCall);
  $('endBtn').addEventListener('click', endCall);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
