<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Live Call — Admin</title>
<meta name="theme-color" content="#1e130d" />
<link rel="manifest" href="admin-manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<style>
  :root{ --accent:#0f9d68; --coffee:#1e130d; --panel:#3a2a20; --line:rgba(255,222,196,0.14); --dim:rgba(255,230,210,0.55); }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--coffee); color:#fff; font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    padding:max(env(safe-area-inset-top),20px) 18px 24px;
  }
  h1{font-size:20px; font-weight:800; margin-bottom:18px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--dim); margin-bottom:7px; text-transform:uppercase; letter-spacing:0.03em;}
  .field input{
    width:100%; background:var(--panel); border:1px solid var(--line); border-radius:12px;
    color:#fff; font-size:15px; padding:12px 14px; font-family:inherit;
  }
  button{-webkit-appearance:none; appearance:none; border:0; cursor:pointer; font-family:inherit;}
  .btn{background:var(--accent); color:#fff; font-weight:650; font-size:15px; padding:13px; border-radius:12px; width:100%;}
  .hint{font-size:12px; color:var(--dim); margin-top:10px; text-align:center;}
  #userList{margin-top:24px; display:none;}
  .userRow{
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px;
    display:flex; justify-content:space-between; align-items:center; gap:12px;
  }
  .userRow .email{font-size:14px; font-weight:600; word-break:break-all;}
  .userRow .date{font-size:11.5px; color:var(--dim); margin-top:2px;}
  .toggleBtn{padding:9px 14px; border-radius:9px; font-size:13px; font-weight:650; flex:none;}
  .toggleBtn.approved{background:var(--accent); color:#fff;}
  .toggleBtn.pending{background:#3a2620; color:var(--dim); border:1px solid var(--line);}
  #signInBox{max-width:340px; margin:60px auto 0;}
</style>
</head>
<body>

<div id="signInBox">
  <h1>Admin sign in</h1>
  <div class="field"><label>Email</label><input id="email" type="email" /></div>
  <div class="field"><label>Password</label><input id="password" type="password" /></div>
  <button class="btn" id="signInBtn">Sign in</button>
  <p class="hint" id="hint"></p>
</div>

<div id="userList">
  <h1>Pending &amp; approved users</h1>
  <div id="rows"></div>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  const supabase = createClient('https://ewgtpxomgkpbmfyddypw.supabase.co', 'sb_publishable_NkeueZ7vabkD9nUIPDaGwQ_GCd5Ci40');

  const $ = (id) => document.getElementById(id);

  $('signInBtn').addEventListener('click', async () => {
    $('hint').textContent = 'Signing in…';
    const { error } = await supabase.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
    if (error) { $('hint').textContent = error.message; return; }
  });

  async function loadUsers(){
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) return;
    const r = await fetch('/api/admin-list-users', { headers: { Authorization: `Bearer ${session.access_token}` } });
    const data = await r.json();
    if (!r.ok) { $('hint').textContent = data.error; $('signInBox').style.display = 'block'; $('userList').style.display = 'none'; return; }

    $('signInBox').style.display = 'none';
    $('userList').style.display = 'block';
    $('rows').innerHTML = data.users.map(u => `
      <div class="userRow">
        <div>
          <div class="email">${u.email || u.user_id}</div>
          <div class="date">${new Date(u.created_at).toLocaleDateString()}</div>
        </div>
        <button class="toggleBtn ${u.approved ? 'approved' : 'pending'}" data-id="${u.user_id}" data-approved="${u.approved}">
          ${u.approved ? 'Approved' : 'Approve'}
        </button>
      </div>
    `).join('');

    document.querySelectorAll('.toggleBtn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const newApproved = btn.dataset.approved !== 'true';
        const { data: { session } } = await supabase.auth.getSession();
        await fetch('/api/admin-set-approval', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
          body: JSON.stringify({ targetUserId: btn.dataset.id, approved: newApproved }),
        });
        loadUsers();
      });
    });
  }

  supabase.auth.onAuthStateChange(() => loadUsers());
  loadUsers();
</script>
</body>
</html>
