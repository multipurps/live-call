<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Live Call — Admin</title>
<meta name="theme-color" content="#1e130d" />
<link rel="manifest" href="admin-manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<style>
  :root{ --accent:#0f9d68; --coffee:#1e130d; --panel:#3a2a20; --line:rgba(255,222,196,0.14); --dim:rgba(255,230,210,0.55); --tabh:58px; }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--coffee); color:#fff; font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    padding-top:max(env(safe-area-inset-top),20px);
  }
  .page{padding:0 18px 24px;}
  h1{font-size:20px; font-weight:800; margin-bottom:18px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--dim); margin-bottom:7px; text-transform:uppercase; letter-spacing:0.03em;}
  .field input, .field textarea{
    width:100%; background:var(--panel); border:1px solid var(--line); border-radius:12px;
    color:#fff; font-size:15px; padding:12px 14px; font-family:inherit; text-align:left; letter-spacing:normal;
  }
  .field textarea{resize:vertical; min-height:84px; line-height:1.4;}
  /* PIN entry is the one input that should look like a code field - scoped so it
     never leaks onto ordinary text fields (that was the announcement-field bug). */
  #pinBox .field input{font-size:20px; text-align:center; letter-spacing:0.3em;}
  button{-webkit-appearance:none; appearance:none; border:0; cursor:pointer; font-family:inherit;}
  .btn{
    width:100%; padding:14px; border-radius:16px; font-size:15px; font-weight:650; color:#fff;
    background:rgba(15,157,104,0.35); backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%);
    border:1px solid rgba(15,157,104,0.6);
  }
  #googleBtn{
    display:flex; align-items:center; justify-content:center; gap:10px;
    background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.18);
  }
  #googleBtn svg{background:#fff; border-radius:50%; padding:2px;}
  .hint{font-size:12px; color:var(--dim); margin-top:12px; text-align:center;}
  #signInBox, #pinBox{max-width:320px; margin:70px auto 0; text-align:center; display:block; padding:0 18px;}
  #pinBox{display:none;}

  #app{display:none; padding-bottom:100px;}
  .tabPanel{display:none;}
  .tabPanel.active{display:block;}

  .userRow{
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px;
    display:flex; justify-content:space-between; align-items:center; gap:12px;
  }
  .userRow .email{font-size:14px; font-weight:600; word-break:break-all;}
  .userRow .date{font-size:11.5px; color:var(--dim); margin-top:2px;}
  .toggleBtn{padding:9px 14px; border-radius:9px; font-size:13px; font-weight:650; flex:none;}
  .toggleBtn.approved{background:var(--accent); color:#fff;}
  .toggleBtn.pending{background:#3a2620; color:var(--dim); border:1px solid var(--line);}

  .splashBgCard{position:relative; border-radius:12px; overflow:hidden; border:1px solid var(--line); aspect-ratio:9/16; background:var(--panel);}
  .splashBgCard img{width:100%; height:100%; object-fit:cover; display:block;}
  .splashBgCard button{
    position:absolute; top:6px; right:6px; width:26px; height:26px; border-radius:50%;
    background:rgba(0,0,0,0.55); color:#fff; font-size:14px; line-height:1; display:flex; align-items:center; justify-content:center;
  }

  .statRow{
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px;
    display:flex; justify-content:space-between; align-items:center; gap:12px;
  }
  .statRow .rank{font-size:13px; font-weight:800; color:var(--dim); width:20px; flex:none;}
  .statRow .email{font-size:14px; font-weight:600; word-break:break-all;}
  .statRow .sub{font-size:11.5px; color:var(--dim); margin-top:2px;}
  .statRow .total{font-size:18px; font-weight:800; color:var(--accent); flex:none; text-align:right;}
  .statRow .totalLbl{font-size:10px; color:var(--dim); font-weight:600; text-transform:uppercase; letter-spacing:0.03em;}
  .emptyState{font-size:13px; color:var(--dim); text-align:center; padding:30px 0;}

  /* Bottom tab nav: a small floating pill, centered, clear of every edge -
     does not sit flush against the bottom, does not reserve safe-area space,
     matches the main app's #tabBar treatment for consistency. */
  #tabBar{
    position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:50;
    display:flex; align-items:center; gap:2px;
    padding:5px;
    border-radius:20px;
    background:rgba(58,42,32,0.65);
    backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%);
    border:1px solid rgba(255,255,255,0.12);
    box-shadow:0 10px 26px rgba(0,0,0,0.45);
  }
  #tabGlider{
    position:absolute; top:5px; left:5px; width:64px; height:52px; border-radius:15px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(14px) saturate(180%); -webkit-backdrop-filter:blur(14px) saturate(180%);
    border:1px solid rgba(255,255,255,0.14);
    transition:transform 0.32s cubic-bezier(0.34, 1.4, 0.64, 1);
    z-index:0; pointer-events:none;
  }
  #tabBar button{
    position:relative; z-index:1;
    flex:none; width:64px; height:52px; background:none; color:var(--dim); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:2px; font-size:9.5px; font-weight:650;
    border-radius:15px; transition:color 0.2s;
  }
  #tabBar button svg{width:19px; height:19px; stroke:currentColor;}
  #tabBar button.active{color:#fff;}
  #tabBar button.active svg{stroke:var(--accent);}
  #tabBar button.active svg.bellIcon{stroke:none; fill:var(--accent);}
</style>
</head>
<body>

<div id="debugBar" style="display:none; position:fixed; top:0; left:0; right:0; background:#ff3b30; color:#fff; font-size:11px; padding:8px 12px; z-index:999; white-space:pre-wrap; word-break:break-all;"></div>
<script>
  window.onerror = function(msg, src, line, col, err){
    const bar = document.getElementById('debugBar');
    bar.style.display = 'block';
    bar.textContent = 'JS ERROR: ' + msg + ' (line ' + line + ')';
  };
  setTimeout(function(){
    var box = document.getElementById('signInBox');
    if (box && getComputedStyle(box).display === 'none' && document.getElementById('app').style.display !== 'block') {
      var bar = document.getElementById('debugBar');
      bar.style.display = 'block';
      bar.innerHTML = 'Could not load (weak connection?). <button onclick="location.reload()" style="text-decoration:underline; background:none; border:0; color:#fff; font-weight:700;">Tap to retry</button>';
    }
  }, 4000);
</script>

<div id="signInBox">
  <h1>Admin</h1>
  <button class="btn" id="googleBtn">
    <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.4 0 5.7 1.5 7 2.7l5.1-5C33 3.9 29 2 24 2 14.8 2 7 7.6 3.9 15.6l6 4.6C11.4 14.1 17.2 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-2.8-.4-4.1H24v7.8h12.7c-.3 2.1-1.6 5.2-4.6 7.3l6 4.6c3.5-3.2 5.4-7.9 5.4-13.6z"/><path fill="#FBBC05" d="M9.9 20.2C9.3 21.9 9 23.9 9 26s.3 4.1.9 5.8l-6 4.6C1.7 33 1 29.6 1 26s.7-7 2.9-10.4z"/><path fill="#34A853" d="M24 46c5 0 9.2-1.7 12.3-4.5l-6-4.6c-1.7 1.1-3.8 1.9-6.3 1.9-6.8 0-12.6-4.6-14.7-10.8l-6 4.6C7 40.4 14.8 46 24 46z"/></svg>
    Continue with Google
  </button>
  <p class="hint" id="hint"></p>
</div>

<div id="pinBox">
  <h1>Enter PIN</h1>
  <div class="field"><input id="pinInput" type="password" inputmode="numeric" maxlength="6" placeholder="••••" /></div>
  <button class="btn" id="pinSubmit">Unlock</button>
  <p class="hint" id="pinHint"></p>
</div>

<div id="app">

  <div class="tabPanel active" id="tab-users">
    <div class="page">
      <h1>Pending &amp; approved users</h1>
      <div id="rows"></div>
    </div>
  </div>

  <div class="tabPanel" id="tab-bg">
    <div class="page">
      <h1>Login background</h1>
      <div id="loginBgPreviewWrap" style="display:none; margin-bottom:12px;">
        <img id="loginBgPreview" style="width:100%; border-radius:14px; display:block; border:1px solid var(--line);" />
      </div>
      <input id="loginBgFile" type="file" accept="image/png,image/jpeg,image/webp" style="display:none;" />
      <button class="btn" id="loginBgPickBtn" style="background:rgba(255,255,255,0.1); border-color:rgba(255,255,255,0.18);">Choose image</button>
      <button class="btn" id="loginBgUploadBtn" style="margin-top:10px; display:none;">Upload as login background</button>
      <button class="btn" id="loginBgClearBtn" style="margin-top:10px; background:rgba(255,59,48,0.2); border-color:rgba(255,59,48,0.45);">Remove current background</button>
      <p class="hint" id="loginBgHint"></p>

      <h1 style="margin-top:28px;">Chat interface background</h1>
      <div id="chatBgPreviewWrap" style="display:none; margin-bottom:12px;">
        <img id="chatBgPreview" style="width:100%; border-radius:14px; display:block; border:1px solid var(--line);" />
      </div>
      <input id="chatBgFile" type="file" accept="image/png,image/jpeg,image/webp" style="display:none;" />
      <button class="btn" id="chatBgPickBtn" style="background:rgba(255,255,255,0.1); border-color:rgba(255,255,255,0.18);">Choose image</button>
      <button class="btn" id="chatBgUploadBtn" style="margin-top:10px; display:none;">Upload as chat background</button>
      <button class="btn" id="chatBgClearBtn" style="margin-top:10px; background:rgba(255,59,48,0.2); border-color:rgba(255,59,48,0.45);">Remove current background</button>
      <p class="hint" id="chatBgHint"></p>

      <h1 style="margin-top:28px;">Splash backgrounds</h1>
      <p class="hint" style="margin-bottom:14px; text-align:left;">The app picks one of these at random every time it's opened. Add as many as you want.</p>
      <div id="splashBgGrid" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;"></div>
      <input id="splashBgFile" type="file" accept="image/png,image/jpeg,image/webp" style="display:none;" />
      <button class="btn" id="splashBgPickBtn" style="background:rgba(255,255,255,0.1); border-color:rgba(255,255,255,0.18);">Add background</button>
      <p class="hint" id="splashBgHint"></p>
    </div>
  </div>

  <div class="tabPanel" id="tab-push">
    <div class="page">
      <h1>Send announcement</h1>
      <div class="field"><label>Title</label><input id="announceTitle" type="text" placeholder="e.g. New feature" /></div>
      <div class="field"><label>Message</label><textarea id="announceBody" rows="3" placeholder="What's the announcement?"></textarea></div>
      <button class="btn" id="announceSendBtn">Push to all users</button>
      <p class="hint" id="announceHint"></p>
    </div>
  </div>

  <div class="tabPanel" id="tab-analytics">
    <div class="page">
      <h1>Most active users</h1>
      <p class="hint" style="margin-bottom:14px; text-align:left;">Ranked by calls + chats. Tap refresh by reopening this tab.</p>
      <div id="statsRows"></div>
    </div>
  </div>

</div>

<nav id="tabBar">
  <div id="tabGlider"></div>
  <button data-tab="users" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"/><path d="M4.5 20c1.6-4 4.4-6 7.5-6s5.9 2 7.5 6"/></svg>
    Users
  </button>
  <button data-tab="bg">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2.2"/><circle cx="8.3" cy="9.3" r="1.6"/><path d="M20 15.5l-4.7-4.7a1.5 1.5 0 0 0-2.1 0L4 19.3"/></svg>
    Backgrounds
  </button>
  <button data-tab="push">
    <svg class="bellIcon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M8.73682 18.8301C9.15103 18.8301 9.48682 19.1659 9.48682 19.5801C9.48682 19.7533 9.53068 19.9323 9.62567 20.1089C9.72135 20.2868 9.86934 20.4625 10.073 20.6194C10.2768 20.7763 10.5283 20.9079 10.8164 20.9998C11.1044 21.0917 11.4174 21.1402 11.7364 21.1402C12.0554 21.1402 12.3684 21.0917 12.6563 20.9998C12.9445 20.9079 13.196 20.7763 13.3998 20.6194C13.6034 20.4625 13.7514 20.2868 13.8471 20.1089C13.9421 19.9323 13.986 19.7533 13.986 19.5801C13.986 19.1659 14.3218 18.8301 14.736 18.8301C15.1502 18.8301 15.486 19.1659 15.486 19.5801C15.486 20.0136 15.3747 20.4354 15.1682 20.8194C14.9624 21.202 14.6685 21.5356 14.315 21.8078C13.9618 22.0799 13.5519 22.2886 13.1122 22.4289C12.6723 22.5692 12.2052 22.6402 11.7364 22.6402C11.2676 22.6402 10.8005 22.5692 10.3606 22.4289C9.92086 22.2886 9.51101 22.0799 9.15774 21.8078C8.80433 21.5356 8.51043 21.202 8.30462 20.8194C8.09812 20.4354 7.98682 20.0136 7.98682 19.5801C7.98682 19.1659 8.3226 18.8301 8.73682 18.8301Z" fill="currentColor"/><path fill-rule="evenodd" clip-rule="evenodd" d="M8.1527 2.50665C10.0555 1.55972 12.2338 1.38369 14.2422 1.98489C14.639 2.10368 14.8644 2.52166 14.7456 2.91847C14.6268 3.31529 14.2088 3.54067 13.812 3.42188C12.1659 2.92913 10.3805 3.07347 8.82097 3.84955C7.08486 4.71351 5.9873 6.48565 5.9873 8.42485L5.9873 9.74613C5.9873 11.1699 5.63253 12.5712 4.95505 13.8234L4.72865 14.2419C3.81979 15.9218 4.81343 17.9997 6.69161 18.3468C10.0265 18.9632 13.4462 18.9632 16.7811 18.3468L16.9413 18.3172C18.8192 17.9701 19.8654 15.9452 19.062 14.2127L18.7974 13.642C18.409 12.8044 18.1565 11.9127 18.0473 11.0003C17.9981 10.589 18.2916 10.2157 18.7029 10.1665C19.1142 10.1173 19.4875 10.4108 19.5367 10.8221C19.6272 11.5781 19.8364 12.317 20.1582 13.0109L20.4228 13.5817C21.6385 16.203 20.0553 19.2671 17.214 19.7922L17.0776 19.0547L17.2139 19.7922L17.0538 19.8218C13.5386 20.4716 9.93413 20.4716 6.41897 19.8218C3.53934 19.2896 2.01589 16.1037 3.40935 13.5281L3.63576 13.1096C4.19463 12.0766 4.4873 10.9206 4.4873 9.74613L4.4873 8.42485C4.4873 5.91646 5.90701 3.62418 8.1527 2.50665Z" fill="currentColor"/><path fill-rule="evenodd" clip-rule="evenodd" d="M17.8602 4.28711C16.8937 4.28711 16.1102 5.07061 16.1102 6.03711C16.1102 7.00361 16.8937 7.78711 17.8602 7.78711C18.8267 7.78711 19.6102 7.00361 19.6102 6.03711C19.6102 5.07061 18.8267 4.28711 17.8602 4.28711ZM14.6102 6.03711C14.6102 4.24218 16.0653 2.78711 17.8602 2.78711C19.6552 2.78711 21.1102 4.24218 21.1102 6.03711C21.1102 7.83203 19.6552 9.28711 17.8602 9.28711C16.0653 9.28711 14.6102 7.83203 14.6102 6.03711Z" fill="currentColor"/></svg>
    Push
  </button>
  <button data-tab="analytics">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M11 20V4M18 20v-7"/></svg>
    Analytics
  </button>
</nav>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  const supabase = createClient('https://ewgtpxomgkpbmfyddypw.supabase.co', 'sb_publishable_NkeueZ7vabkD9nUIPDaGwQ_GCd5Ci40');

  const ADMIN_PIN = '2048';
  const $ = (id) => document.getElementById(id);

  $('googleBtn').addEventListener('click', async () => {
    await supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin + '/admin.html' } });
  });

  function showPinGate(){
    $('signInBox').style.display = 'none';
    $('app').style.display = 'none';
    if (localStorage.getItem('admin_pin_ok') === 'true') { loadApp(); return; }
    $('pinBox').style.display = 'block';
  }

  $('pinSubmit').addEventListener('click', () => {
    if ($('pinInput').value === ADMIN_PIN) {
      localStorage.setItem('admin_pin_ok', 'true');
      $('pinBox').style.display = 'none';
      loadApp();
    } else {
      $('pinHint').textContent = 'Wrong PIN.';
    }
  });

  // ---- Tabs ----
  const TABS = ['users', 'bg', 'push', 'analytics'];
  function moveTabGlider(name){
    const glider = $('tabGlider');
    const btn = document.querySelector(`#tabBar button[data-tab="${name}"]`);
    if (!glider || !btn) return;
    const barRect = $('tabBar').getBoundingClientRect();
    const btnRect = btn.getBoundingClientRect();
    if (btnRect.width === 0) return;
    glider.style.transform = `translateX(${btnRect.left - barRect.left - 5}px)`;
  }
  function showTab(name){
    TABS.forEach(t => {
      $('tab-' + t).classList.toggle('active', t === name);
    });
    document.querySelectorAll('#tabBar button').forEach(b => {
      b.classList.toggle('active', b.dataset.tab === name);
    });
    moveTabGlider(name);
    if (name === 'analytics') loadAnalytics();
  }
  document.querySelectorAll('#tabBar button').forEach(btn => {
    btn.addEventListener('click', () => showTab(btn.dataset.tab));
  });
  window.addEventListener('resize', () => moveTabGlider(document.querySelector('#tabBar button.active')?.dataset.tab || 'users'));
  setTimeout(() => moveTabGlider('users'), 50);

  function loadApp(){
    $('pinBox').style.display = 'none';
    $('app').style.display = 'block';
    showTab('users');
    loadUsers();
    loadLoginBg();
    loadChatBg();
    loadSplashBgs();
  }

  async function loadUsers(){
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) return;
    const r = await fetch('/api/admin-list-users', { headers: { Authorization: `Bearer ${session.access_token}` } });
    const data = await r.json();
    if (!r.ok) { $('hint').textContent = data.error; $('signInBox').style.display = 'block'; $('pinBox').style.display = 'none'; $('app').style.display = 'none'; return; }

    $('rows').innerHTML = data.users.map(u => `
      <div class="userRow">
        <div>
          <div class="email">${u.email || u.user_id}</div>
          <div class="date">${new Date(u.created_at).toLocaleDateString()}</div>
        </div>
        <button class="toggleBtn ${u.approved ? 'approved' : 'pending'}" data-id="${u.user_id}" data-approved="${u.approved}">
          ${u.approved ? 'Approved' : 'Approve'}
        </button>
      </div>
    `).join('');

    document.querySelectorAll('.toggleBtn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const newApproved = btn.dataset.approved !== 'true';
        const { data: { session } } = await supabase.auth.getSession();
        await fetch('/api/admin-set-approval', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
          body: JSON.stringify({ targetUserId: btn.dataset.id, approved: newApproved }),
        });
        loadUsers();
      });
    });
  }

  async function loadLoginBg(){
    const { data } = await supabase.from('app_settings').select('login_bg_url').eq('id', true).maybeSingle();
    const url = data?.login_bg_url;
    if (url) {
      $('loginBgPreview').src = url;
      $('loginBgPreviewWrap').style.display = 'block';
    } else {
      $('loginBgPreviewWrap').style.display = 'none';
    }
  }

  let pickedFile = null;
  $('loginBgPickBtn').addEventListener('click', () => $('loginBgFile').click());
  $('loginBgFile').addEventListener('change', () => {
    const file = $('loginBgFile').files[0];
    if (!file) return;
    pickedFile = file;
    $('loginBgPreview').src = URL.createObjectURL(file);
    $('loginBgPreviewWrap').style.display = 'block';
    $('loginBgUploadBtn').style.display = 'block';
    $('loginBgHint').textContent = '';
  });
  $('loginBgUploadBtn').addEventListener('click', async () => {
    if (!pickedFile) return;
    $('loginBgHint').textContent = 'Uploading…';
    const reader = new FileReader();
    reader.onload = async () => {
      const { data: { session } } = await supabase.auth.getSession();
      const fileExt = (pickedFile.name.split('.').pop() || 'jpg').toLowerCase();
      const r = await fetch('/api/admin-upload-login-bg', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
        body: JSON.stringify({ imageBase64: reader.result, fileExt }),
      });
      const data = await r.json();
      if (!r.ok) { $('loginBgHint').textContent = data.error; return; }
      $('loginBgHint').textContent = 'Saved — live on the login screen now.';
      $('loginBgUploadBtn').style.display = 'none';
      pickedFile = null;
      loadLoginBg();
    };
    reader.readAsDataURL(pickedFile);
  });
  $('loginBgClearBtn').addEventListener('click', async () => {
    $('loginBgHint').textContent = 'Removing…';
    const { data: { session } } = await supabase.auth.getSession();
    const r = await fetch('/api/admin-upload-login-bg', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
      body: JSON.stringify({ action: 'clear' }),
    });
    const data = await r.json();
    if (!r.ok) { $('loginBgHint').textContent = data.error; return; }
    $('loginBgHint').textContent = 'Removed — login screen back to default.';
    loadLoginBg();
  });

  async function loadChatBg(){
    const { data } = await supabase.from('app_settings').select('chat_bg_url').eq('id', true).maybeSingle();
    const url = data?.chat_bg_url;
    if (url) {
      $('chatBgPreview').src = url;
      $('chatBgPreviewWrap').style.display = 'block';
    } else {
      $('chatBgPreviewWrap').style.display = 'none';
    }
  }

  let pickedChatFile = null;
  $('chatBgPickBtn').addEventListener('click', () => $('chatBgFile').click());
  $('chatBgFile').addEventListener('change', () => {
    const file = $('chatBgFile').files[0];
    if (!file) return;
    pickedChatFile = file;
    $('chatBgPreview').src = URL.createObjectURL(file);
    $('chatBgPreviewWrap').style.display = 'block';
    $('chatBgUploadBtn').style.display = 'block';
    $('chatBgHint').textContent = '';
  });
  $('chatBgUploadBtn').addEventListener('click', async () => {
    if (!pickedChatFile) return;
    $('chatBgHint').textContent = 'Uploading…';
    const reader = new FileReader();
    reader.onload = async () => {
      const { data: { session } } = await supabase.auth.getSession();
      const fileExt = (pickedChatFile.name.split('.').pop() || 'jpg').toLowerCase();
      const r = await fetch('/api/admin-upload-chat-bg', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
        body: JSON.stringify({ imageBase64: reader.result, fileExt }),
      });
      const data = await r.json();
      if (!r.ok) { $('chatBgHint').textContent = data.error; return; }
      $('chatBgHint').textContent = 'Saved — live in the chat screen now.';
      $('chatBgUploadBtn').style.display = 'none';
      pickedChatFile = null;
      loadChatBg();
    };
    reader.readAsDataURL(pickedChatFile);
  });
  $('chatBgClearBtn').addEventListener('click', async () => {
    $('chatBgHint').textContent = 'Removing…';
    const { data: { session } } = await supabase.auth.getSession();
    const r = await fetch('/api/admin-upload-chat-bg', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
      body: JSON.stringify({ action: 'clear' }),
    });
    const data = await r.json();
    if (!r.ok) { $('chatBgHint').textContent = data.error; return; }
    $('chatBgHint').textContent = 'Removed — chat screen back to default.';
    loadChatBg();
  });

  async function loadSplashBgs(){
    const { data } = await supabase.from('splash_backgrounds').select('id,url').order('created_at', { ascending: false });
    $('splashBgGrid').innerHTML = (data || []).map(row => `
      <div class="splashBgCard">
        <img src="${row.url}" />
        <button data-id="${row.id}" title="Remove">✕</button>
      </div>
    `).join('');
    document.querySelectorAll('.splashBgCard button').forEach(btn => {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        const { data: { session } } = await supabase.auth.getSession();
        const r = await fetch('/api/admin-upload-splash-bg', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
          body: JSON.stringify({ action: 'delete', id: btn.dataset.id }),
        });
        const data = await r.json();
        if (!r.ok) { $('splashBgHint').textContent = data.error; btn.disabled = false; return; }
        loadSplashBgs();
      });
    });
  }

  $('splashBgPickBtn').addEventListener('click', () => $('splashBgFile').click());
  $('splashBgFile').addEventListener('change', () => {
    const file = $('splashBgFile').files[0];
    if (!file) return;
    $('splashBgHint').textContent = 'Uploading…';
    const reader = new FileReader();
    reader.onload = async () => {
      const { data: { session } } = await supabase.auth.getSession();
      const fileExt = (file.name.split('.').pop() || 'jpg').toLowerCase();
      const r = await fetch('/api/admin-upload-splash-bg', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
        body: JSON.stringify({ imageBase64: reader.result, fileExt }),
      });
      const data = await r.json();
      $('splashBgFile').value = '';
      if (!r.ok) { $('splashBgHint').textContent = data.error; return; }
      $('splashBgHint').textContent = 'Added.';
      loadSplashBgs();
    };
    reader.readAsDataURL(file);
  });

  $('announceSendBtn').addEventListener('click', async () => {
    const title = $('announceTitle').value.trim();
    const body = $('announceBody').value.trim();
    if (!title || !body) { $('announceHint').textContent = 'Fill in both fields.'; return; }
    $('announceHint').textContent = 'Sending…';
    const { data: { session } } = await supabase.auth.getSession();
    const r = await fetch('/api/send-announcement', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
      body: JSON.stringify({ title, body }),
    });
    const data = await r.json();
    if (!r.ok) { $('announceHint').textContent = data.error; return; }
    $('announceHint').textContent = `Sent to ${data.sent} of ${data.total} subscribed users.`;
    $('announceTitle').value = ''; $('announceBody').value = '';
  });

  async function loadAnalytics(){
    $('statsRows').innerHTML = '<p class="emptyState">Loading…</p>';
    const { data: { session } } = await supabase.auth.getSession();
    const r = await fetch('/api/admin-analytics', { headers: { Authorization: `Bearer ${session.access_token}` } });
    const data = await r.json();
    if (!r.ok) { $('statsRows').innerHTML = `<p class="emptyState">${data.error}</p>`; return; }
    if (!data.users.length) { $('statsRows').innerHTML = '<p class="emptyState">No user activity yet.</p>'; return; }
    $('statsRows').innerHTML = data.users.map((u, i) => `
      <div class="statRow">
        <div class="rank">${i + 1}</div>
        <div style="flex:1; min-width:0;">
          <div class="email">${u.email || u.user_id}</div>
          <div class="sub">${u.calls} call${u.calls === 1 ? '' : 's'} · ${u.chats} chat${u.chats === 1 ? '' : 's'}${u.lastActive ? ' · last active ' + new Date(u.lastActive).toLocaleDateString() : ''}</div>
        </div>
        <div>
          <div class="total">${u.total}</div>
          <div class="totalLbl">total</div>
        </div>
      </div>
    `).join('');
  }

  supabase.auth.onAuthStateChange((_event, session) => {
    if (session?.user) showPinGate();
    else { $('signInBox').style.display = 'block'; $('pinBox').style.display = 'none'; $('app').style.display = 'none'; }
  });
</script></body>
</html>
