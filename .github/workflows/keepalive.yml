name: Keep Render Backend Awake

# Pings the live-call Render service every 10 minutes so it doesn't spin
# down (Render free tier sleeps after ~15 min idle) and wipe the
# WhatsApp/Telegram session files on the next cold start.
#
# Toggled on/off from the app itself (Profile > Developer > Keep Backend
# Awake), which enables/disables THIS WORKFLOW via the GitHub Actions API.
# A disabled workflow never runs at all, so when it's off, Render is left
# completely undisturbed - no accidental wake-ups, no 24/7 running.
# This runs on GitHub's infrastructure, independent of Render, so it keeps
# working even through Render restarts/redeploys/cold starts.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render
        run: curl -fsS -o /dev/null -m 20 https://live-call-f3qm.onrender.com/api/keepalive/ping
